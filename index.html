<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var origFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = typeof val === 'function' ? val : origFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Graceful fallback if non-configurable
        }
      })();
    </script>
    <title>Nextcloud Excel Sync</title>
    <meta name="description" content="Centralized platform for bidirectional synchronization of complex Excel workbooks between Nextcloud WebDAV and Supabase PostgreSQL with staging-buffered conflict resolution." />
    <meta property="og:title" content="Nextcloud Excel Sync" />
    <meta property="og:description" content="Centralized platform for bidirectional synchronization of complex Excel workbooks between Nextcloud WebDAV and Supabase PostgreSQL with staging-buffered conflict resolution." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
